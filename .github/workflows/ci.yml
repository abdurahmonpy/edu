name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check backend

      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest backend/tests -q

  frontend:
    name: Frontend (integration check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check page wiring
        run: node scripts/check-frontend.mjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t englify:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name englify -p 8000:8000 \
            -e SECRET_KEY=ci-secret-key \
            -e DATABASE_URL=sqlite+aiosqlite:///./ci.db \
            -e SEED_DEMO_DATA=true \
            englify:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1 > /dev/null
          curl -fsS http://127.0.0.1:8000/ | head -c 80
          docker logs englify | tail -n 30
          docker rm -f englify
