  a{color:inherit;text-decoration:none}
  .card{background:#fff;border-radius:38px;padding:46px 40px;max-width:560px;text-align:center;

  .primary{background:repeating-linear-gradient(115deg,#1684CF 0 30px,#69B9E6 30px 60px);
           box-shadow:0 6px 0 #075AA4;color:#04321F}
  .primary:hover{transform:translateY(-2px);box-shadow:0 9px 0 #075AA4}
  .ghost{background:#fff;color:#08264D;border:2px solid #D4E2EE}
  .ghost:hover{background:#EFF5FA}
  .links{margin-top:26px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
