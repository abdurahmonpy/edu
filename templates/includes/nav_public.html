{% load static %}
<!-- Public Header for unauthenticated / landing / public pages -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="{% url 'home' %}" class="flex items-center space-x-3 text-slate-900 hover:opacity-90 transition">
      <div class="w-10 h-10 rounded-xl bg-white border border-slate-200 overflow-hidden shadow-xs flex items-center justify-center p-0.5">
        <img src="{% static 'images/unimentor_logo.png' %}" alt="UniMentor AI" class="w-full h-full object-contain scale-110">
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="text-xl font-extrabold text-slate-900 tracking-tight">UniMentor</span>
        <span class="text-[10px] font-black uppercase px-1.5 py-0.5 rounded-md bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-xs">AI</span>
      </div>
    </a>

    <!-- Public Nav Links -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-600">
      <a href="{% url 'home' %}#features" class="hover:text-indigo-600 transition">Imkoniyatlar</a>
      <a href="{% url 'home' %}#programs" class="hover:text-indigo-600 transition">Grantlar</a>
      <a href="{% url 'home' %}#how-it-works" class="hover:text-indigo-600 transition">Qanday ishlaydi?</a>
      <a href="{% url 'programs:catalog' %}" class="hover:text-indigo-600 transition">Dasturlar katalogi</a>
    </nav>

    <!-- Auth Actions -->
    <div class="flex items-center space-x-3">
      {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard:index' %}" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs transition space-x-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Boshqaruv paneli</span>
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-sm font-semibold text-slate-700 hover:text-indigo-600 px-3 py-2 rounded-xl transition">
          Kirish
        </a>
        <a href="{% url 'accounts:register' %}" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs transition space-x-1">
          <span>Ro'yxatdan o'tish</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </a>
      {% endif %}
    </div>
  </div>
</header>
