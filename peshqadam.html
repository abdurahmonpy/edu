<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peshqadamlar jadvali — Englify</title>
<meta name="theme-color" content="#00A3FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #00A3FF;
  --ink: #220846;
  --bg: #F5F7FD;
  --border: #E8EBF5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}
a, button { color: inherit; text-decoration: none; font-family: inherit; }

/* Top Blue Header */
.leader-header {
  background: #00A3FF;
  color: #fff;
  padding: 16px 20px 24px;
}
.header-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}
.back-btn {
  background: none;
  border: 0;
  padding: 6px;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
}

/* User Card in Header (Exact match to screenshot 4) */
.user-profile-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.user-avatar-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: #E4E8F2;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}
.user-name-text {
  font-weight: 800;
  font-size: 24px;
  color: #fff;
  margin-left: 14px;
}
.level-badge-pill {
  background: #fff;
  color: #00A3FF;
  border-radius: 999px;
  padding: 5px 16px;
  font-weight: 800;
  font-size: 15px;
  display: inline-block;
  margin-bottom: 6px;
}
.score-pill {
  background: #fff;
  color: #00A3FF;
  border-radius: 999px;
  padding: 4px 14px;
  font-weight: 800;
  font-size: 15px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Tabs */
.tabs-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-scroll::-webkit-scrollbar { display: none; }
.level-tab {
  background: rgba(255,255,255,0.25);
  color: #fff;
  border: 0;
  border-radius: 999px;
  padding: 8px 18px;
  font-weight: 800;
  font-size: 15px;
  white-space: nowrap;
  cursor: pointer;
  transition: all .15s;
}
.level-tab.active {
  background: #fff;
  color: #00A3FF;
}

/* Leaderboard List Container */
.container {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 18px 60px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Leader Card */
.leader-card {
  background: #fff;
  border: 2px solid #E8EBF5;
  border-radius: 20px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 14px rgba(34,8,70,0.02);
  transition: transform .12s;
}
.leader-card:hover {
  transform: translateY(-2px);
}

.rank-num {
  font-weight: 800;
  font-size: 18px;
  color: var(--ink);
  width: 24px;
  text-align: center;
}
.player-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #E4E8F2;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  font-size: 20px;
  overflow: hidden;
}
.player-name {
  font-weight: 800;
  font-size: 18px;
  color: var(--ink);
  margin-left: 12px;
}
.player-score {
  background: #fff;
  border: 1.5px solid #E8EBF5;
  border-radius: 999px;
  padding: 5px 14px;
  font-weight: 800;
  font-size: 15px;
  color: #1F0D52;
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>
<body data-auth="required">

  <!-- Top Blue Header with User Info (Screenshot 4) -->
  <header class="leader-header">
    <div style="max-width: 680px; margin: 0 auto">
      <div class="header-bar">
        <a href="/dashboard#asosiy" class="back-btn" aria-label="Orqaga">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h1 style="margin: 0; font-weight: 800; font-size: 22px">Peshqadamlar jadvali</h1>
      </div>

      <!-- Abdurahmon Profile -->
      <div class="user-profile-row">
        <div style="display: flex; align-items: center">
          <div class="user-avatar-circle">
            <svg viewBox="0 0 40 40" width="48" height="48"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
          </div>
          <div class="user-name-text" data-user-name>Abdurahmon</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-end">
          <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px">
            <div class="level-badge-pill" style="margin-bottom: 0" data-user-level>Starter</div>
            <div class="level-badge-pill" style="margin-bottom: 0; background: rgba(255,255,255,0.25); color: #fff" data-user-rank>—</div>
          </div>
          <div class="score-pill">
            <span style="color: #2ED573">⭐</span> <span data-user-points>1</span>
          </div>
        </div>
      </div>

      <!-- Level Tabs -->
      <div class="tabs-scroll">
        <button class="level-tab active" onclick="switchLevelTab('all', this)">Umumiy</button>
        <button class="level-tab" onclick="switchLevelTab('starter', this)">Starter</button>
        <button class="level-tab" onclick="switchLevelTab('beginner', this)">Beginner</button>
        <button class="level-tab" onclick="switchLevelTab('elementary', this)">Elementary</button>
        <button class="level-tab" onclick="switchLevelTab('pre-intermediate', this)">Pre-Intermediate</button>
        <button class="level-tab" onclick="switchLevelTab('intermediate', this)">Intermediate</button>
      </div>

      <!-- Davr tanlash -->
      <div id="periodTabs" style="display: flex; gap: 8px; margin-top: 10px">
        <button type="button" class="period-tab" data-period="all" style="background: #fff; color: #00A3FF; border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 13.5px; white-space: nowrap; cursor: pointer">Umumiy</button>
        <button type="button" class="period-tab" data-period="week" style="background: rgba(255,255,255,0.25); color: #fff; border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 800; font-size: 13.5px; white-space: nowrap; cursor: pointer">Haftalik</button>
      </div>
    </div>
  </header>

  <!-- Leaderboard List Container -->
  <div class="container" id="leaderboardList">
    
    <!-- 1: Englify -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">1</span>
        <div class="player-avatar" style="background: #00A3FF; color: #fff; font-size: 11px; font-weight: 800; margin-left: 12px">
          Englify
          <span style="position: absolute; bottom: 0; right: 0; font-size: 10px">👑</span>
        </div>
        <span class="player-name">Englify</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 3406
      </div>
    </div>

    <!-- 2: SIGMA -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">2</span>
        <div class="player-avatar" style="margin-left: 12px">
          <svg viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
        </div>
        <span class="player-name">SIGMA</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 3146
      </div>
    </div>

    <!-- 3: Adhamjon -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">3</span>
        <div class="player-avatar" style="margin-left: 12px">
          <svg viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
          <span style="position: absolute; bottom: 0; right: 0; font-size: 10px">👑</span>
        </div>
        <span class="player-name">Adhamjon</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 3110
      </div>
    </div>

    <!-- 4: Abror -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">4</span>
        <div class="player-avatar" style="margin-left: 12px">
          <svg viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
          <span style="position: absolute; bottom: 0; right: 0; font-size: 10px">👑</span>
        </div>
        <span class="player-name">Abror</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 2651
      </div>
    </div>

    <!-- 5: Gulbaxor -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">5</span>
        <div class="player-avatar" style="margin-left: 12px">
          <svg viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
        </div>
        <span class="player-name">Gulbaxor</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 2636
      </div>
    </div>

    <!-- 6: Gulnoza -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">6</span>
        <div class="player-avatar" style="margin-left: 12px; background: #FFD180">
          👧
        </div>
        <span class="player-name">Gulnoza</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 2515
      </div>
    </div>

    <!-- 7: Boximboyev -->
    <div class="leader-card">
      <div style="display: flex; align-items: center">
        <span class="rank-num">7</span>
        <div class="player-avatar" style="margin-left: 12px">
          <svg viewBox="0 0 40 40" width="36" height="36"><circle cx="20" cy="15" r="7" fill="#8CA0B5"/><path d="M5 40c0-10 7-14 15-14s15 4 15 14z" fill="#8CA0B5"/></svg>
        </div>
        <span class="player-name">Boximboyev</span>
      </div>
      <div class="player-score">
        <span style="color: #2ED573">⭐</span> 2346
      </div>
    </div>

  </div>

<script src="assets/js/config.js"></script>
<script src="assets/js/ui.js"></script>

</body>
</html>
