<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhbatlar — SULTAN EDU</title>
<meta name="theme-color" content="#08264D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #0B5AA4;
  --ink: #220846;
  --bg: #F5F7FD;
  --border: #E8EBF5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a, button { color: inherit; text-decoration: none; font-family: inherit; }

/* Top Header */
.top-nav {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 4vw, 32px);
  background: #fff;
  border-bottom: 1px solid #ECEFF8;
  position: sticky;
  top: 0;
  z-index: 30;
}
.nav-btn {
  background: none;
  border: 0;
  padding: 8px;
  cursor: pointer;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 18px 40px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Chat List Card (Exact match to screenshot 3) */
.chats-box {
  background: #fff;
  border: 2px solid #E8EBF5;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(34,8,70,0.03);
}

.chat-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  cursor: pointer;
  border-bottom: 1px solid #ECEFF8;
  transition: background .15s;
}
.chat-row:last-child {
  border-bottom: 0;
}
.chat-row:hover {
  background: #F8FAFD;
}

.avatar-badge {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #0099FF;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 22px;
  flex-shrink: 0;
}

.chat-title {
  font-weight: 800;
  font-size: 18px;
  color: var(--ink);
}
.chat-preview {
  font-size: 14.5px;
  color: #6C7A9C;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
}
.chat-time {
  font-size: 12.5px;
  color: #7987A8;
  font-weight: 600;
  white-space: nowrap;
}

/* Single Chat Conversation View */
#chatRoomView {
  display: none;
  flex-direction: column;
  flex: 1;
  max-width: 700px;
  width: 100%;
  margin: 0 auto;
  background: #fff;
  border: 2px solid #E8EBF5;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(34,8,70,0.04);
}
.messages-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #F8FAFE;
  min-height: 420px;
}
.msg-bubble {
  padding: 12px 18px;
  border-radius: 20px;
  max-width: 80%;
  font-size: 15.5px;
  line-height: 1.45;
}
.msg-bubble.bot {
  background: #fff;
  border: 1px solid #E2E6F2;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.msg-bubble.user {
  background: #0B5AA4;
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.input-row {
  display: flex;
  padding: 14px 18px;
  background: #fff;
  border-top: 1px solid #ECEFF8;
  gap: 10px;
}
.chat-text-input {
  flex: 1;
  background: #F3F6FA;
  border: 1.5px solid #E2E6F2;
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 15px;
  outline: none;
  font-family: inherit;
}
</style>
<link rel="stylesheet" href="assets/css/sultan-brand.css">
<script src="assets/js/navigation.js"></script>
</head>
<body data-auth="required">

  <!-- Top Header -->
  <header class="top-nav">
    <button class="nav-btn" onclick="handleChatBack()" aria-label="Orqaga">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-weight: 800; font-size: 21px; color: var(--ink)" id="chatHeaderTitle">Suhbatlar</div>
    <button class="nav-btn" onclick="markAllChatRead()" aria-label="O'qilgan deb belgilash">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/><polyline points="23 9 14 19 11 16"/></svg>
    </button>
  </header>

  <!-- SCREEN 1: CHATS LIST (Exact screenshot 3) -->
  <div class="container" id="chatListView">
    
    <div class="chats-box" id="chatList">
      
      <!-- Support Service -->
      <div class="chat-row" onclick="openChatRoom('Support Service', 'S')">
        <div class="avatar-badge">S</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">Support Service</span>
            <span class="chat-time">08 avg 15:52</span>
          </div>
          <div class="chat-preview">Assalom alaykum! Sizni EN...</div>
        </div>
      </div>

      <!-- SULTAN EDU -->
      <div class="chat-row" onclick="openChatRoom('SULTAN EDU', 'E')">
        <div class="avatar-badge">E</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">SULTAN EDU</span>
            <span class="chat-time">11 may 09:25</span>
          </div>
          <div class="chat-preview">👋 Welcome! Your first ste...</div>
        </div>
      </div>

      <!-- Alomat (Bot) -->
      <div class="chat-row" onclick="openChatRoom('Alomat (Bot)', 'A')">
        <div class="avatar-badge">A</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">Alomat (Bot)</span>
            <span class="chat-time">Hozir</span>
          </div>
          <div class="chat-preview">Savollaringiz bo'lsa marhamat...</div>
        </div>
      </div>

    </div>

  </div>

  <!-- SCREEN 2: ACTIVE CONVERSATION ROOM -->
  <div class="container" id="chatRoomContainer" style="display: none">
    <div id="chatRoomView" style="display: flex">
      <div class="messages-box" id="messagesArea">
        <!-- Messages -->
      </div>
      <form class="input-row" onsubmit="sendChatMessage(event)">
        <input type="text" class="chat-text-input" id="chatInput" placeholder="Xabar yozing..." autocomplete="off">
        <button type="submit" style="background: #0B5AA4; color: #fff; border: 0; border-radius: 14px; padding: 0 18px; font-weight: 700; cursor: pointer">
          Yuborish
        </button>
      </form>
    </div>
  </div>

<script src="assets/js/config.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pages/chat.js"></script>
</body>
</html>
