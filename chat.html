<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhbatlar — Englify</title>
<meta name="theme-color" content="#2A0B5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #0A93F5;
  --ink: #220846;
  --bg: #F5F7FD;
  --border: #E8EBF5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a, button { color: inherit; text-decoration: none; font-family: inherit; }

/* Top Header */
.top-nav {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(16px, 4vw, 32px);
  background: #fff;
  border-bottom: 1px solid #ECEFF8;
  position: sticky;
  top: 0;
  z-index: 30;
}
.nav-btn {
  background: none;
  border: 0;
  padding: 8px;
  cursor: pointer;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 18px 40px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Chat List Card (Exact match to screenshot 3) */
.chats-box {
  background: #fff;
  border: 2px solid #E8EBF5;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(34,8,70,0.03);
}

.chat-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  cursor: pointer;
  border-bottom: 1px solid #ECEFF8;
  transition: background .15s;
}
.chat-row:last-child {
  border-bottom: 0;
}
.chat-row:hover {
  background: #F8FAFD;
}

.avatar-badge {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #0099FF;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 22px;
  flex-shrink: 0;
}

.chat-title {
  font-weight: 800;
  font-size: 18px;
  color: var(--ink);
}
.chat-preview {
  font-size: 14.5px;
  color: #6C7A9C;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
}
.chat-time {
  font-size: 12.5px;
  color: #7987A8;
  font-weight: 600;
  white-space: nowrap;
}

/* Single Chat Conversation View */
#chatRoomView {
  display: none;
  flex-direction: column;
  flex: 1;
  max-width: 700px;
  width: 100%;
  margin: 0 auto;
  background: #fff;
  border: 2px solid #E8EBF5;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(34,8,70,0.04);
}
.messages-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #F8FAFE;
  min-height: 420px;
}
.msg-bubble {
  padding: 12px 18px;
  border-radius: 20px;
  max-width: 80%;
  font-size: 15.5px;
  line-height: 1.45;
}
.msg-bubble.bot {
  background: #fff;
  border: 1px solid #E2E6F2;
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.msg-bubble.user {
  background: #0A93F5;
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.input-row {
  display: flex;
  padding: 14px 18px;
  background: #fff;
  border-top: 1px solid #ECEFF8;
  gap: 10px;
}
.chat-text-input {
  flex: 1;
  background: #F3F5FB;
  border: 1.5px solid #E2E6F2;
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 15px;
  outline: none;
  font-family: inherit;
}
</style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-nav">
    <button class="nav-btn" onclick="handleChatBack()" aria-label="Orqaga">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-weight: 800; font-size: 21px; color: var(--ink)" id="chatHeaderTitle">Suhbatlar</div>
    <button class="nav-btn" onclick="markAllChatRead()" aria-label="O'qilgan deb belgilash">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/><polyline points="23 9 14 19 11 16"/></svg>
    </button>
  </header>

  <!-- SCREEN 1: CHATS LIST (Exact screenshot 3) -->
  <div class="container" id="chatListView">
    
    <div class="chats-box">
      
      <!-- Support Service -->
      <div class="chat-row" onclick="openChatRoom('Support Service', 'S')">
        <div class="avatar-badge">S</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">Support Service</span>
            <span class="chat-time">08 avg 15:52</span>
          </div>
          <div class="chat-preview">Assalom alaykum! Sizni EN...</div>
        </div>
      </div>

      <!-- Englify -->
      <div class="chat-row" onclick="openChatRoom('Englify', 'E')">
        <div class="avatar-badge">E</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">Englify</span>
            <span class="chat-time">11 may 09:25</span>
          </div>
          <div class="chat-preview">👋 Welcome! Your first ste...</div>
        </div>
      </div>

      <!-- Alomat (Bot) -->
      <div class="chat-row" onclick="openChatRoom('Alomat (Bot)', 'A')">
        <div class="avatar-badge">A</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <span class="chat-title">Alomat (Bot)</span>
            <span class="chat-time">Hozir</span>
          </div>
          <div class="chat-preview">Savollaringiz bo'lsa marhamat...</div>
        </div>
      </div>

    </div>

  </div>

  <!-- SCREEN 2: ACTIVE CONVERSATION ROOM -->
  <div class="container" id="chatRoomContainer" style="display: none">
    <div id="chatRoomView" style="display: flex">
      <div class="messages-box" id="messagesArea">
        <!-- Messages -->
      </div>
      <form class="input-row" onsubmit="sendChatMessage(event)">
        <input type="text" class="chat-text-input" id="chatInput" placeholder="Xabar yozing..." autocomplete="off">
        <button type="submit" style="background: #0A93F5; color: #fff; border: 0; border-radius: 14px; padding: 0 18px; font-weight: 700; cursor: pointer">
          Yuborish
        </button>
      </form>
    </div>
  </div>

<script src="auth-ui.js"></script>
<script>
let curChatTitle = '';
let curRoomLetter = '';
let pollTimer = null;
let curUserId = null;

function handleChatBack() {
  const room = document.getElementById('chatRoomContainer');
  if (room.style.display === 'flex') {
    room.style.display = 'none';
    document.getElementById('chatListView').style.display = 'flex';
    document.getElementById('chatHeaderTitle').textContent = 'Suhbatlar';
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    curChatTitle = '';
  } else {
    window.location.href = 'app.html#asosiy';
  }
}

function openChatRoom(title, letter) {
  curChatTitle = title;
  curRoomLetter = letter;
  document.getElementById('chatListView').style.display = 'none';
  document.getElementById('chatRoomContainer').style.display = 'flex';
  document.getElementById('chatHeaderTitle').textContent = title;

  loadRoom();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadRoom, 5000);
}

function showLoginNotice() {
  const area = document.getElementById('messagesArea');
  area.innerHTML = '';
  const box = document.createElement('div');
  box.style.cssText = 'margin:auto;text-align:center;padding:28px 20px;background:#fff;border-radius:24px;box-shadow:0 8px 0 #E3E9FF;max-width:340px';
  const t = document.createElement('div');
  t.style.cssText = 'font-weight:800;font-size:17px;margin-bottom:6px;color:#14172B';
  t.textContent = 'Xabar yozish uchun tizimga kiring';
  const s = document.createElement('div');
  s.style.cssText = 'font-weight:600;font-size:14px;color:#6A5A92;margin-bottom:14px';
  s.textContent = 'Hisobingiz bo‘lsa kiring, yo‘q bo‘lsa bir necha soniyada ro‘yxatdan o‘ting.';
  const b = document.createElement('button');
  b.textContent = 'Kirish / Ro‘yxatdan o‘tish';
  b.style.cssText = 'border:0;background:#0A93F5;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer';
  b.addEventListener('click', () => eduAuth.openModal('login'));
  box.appendChild(t); box.appendChild(s); box.appendChild(b);
  area.appendChild(box);
  area.scrollTop = area.scrollHeight;
}

async function loadRoom() {
  if (!curChatTitle) return;
  const user = await eduAuth.getSession();
  curUserId = user ? user.id : null;
  if (!user) { showLoginNotice(); return; }
  try {
    const r = await fetch('/api/chat?room=' + encodeURIComponent(curChatTitle), { credentials: 'same-origin' });
    if (r.status === 401) { showLoginNotice(); return; }
    if (!r.ok) return;
    const data = await r.json();
    renderMessages(data.messages || []);
  } catch (e) { /* tarmoq xatosi — polling keyingi safar qayta urinadi */ }
}

function renderMessages(msgs) {
  const area = document.getElementById('messagesArea');
  area.innerHTML = '';
  if (!msgs.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'margin:auto;text-align:center;font-weight:600;color:#8A88B3;padding:20px';
    empty.textContent = 'Hali xabarlar yo‘q. Birinchi xabarni yozing!';
    area.appendChild(empty);
  }
  msgs.forEach(m => {
    const mine = curUserId && m.user_id === curUserId;
    const div = document.createElement('div');
    div.className = 'msg-bubble ' + (mine ? 'user' : 'bot');
    if (!mine && m.author_name) {
      const a = document.createElement('div');
      a.style.cssText = 'font-weight:800;font-size:12px;opacity:.75;margin-bottom:2px';
      a.textContent = m.author_name;
      div.appendChild(a);
    }
    const body = document.createElement('div');
    body.textContent = m.body;
    div.appendChild(body);
    area.appendChild(div);
  });
  area.scrollTop = area.scrollHeight;
}

async function sendChatMessage(e) {
  e.preventDefault();
  const inp = document.getElementById('chatInput');
  const txt = inp.value.trim();
  if (!txt || !curChatTitle) return;

  const user = await eduAuth.getSession();
  if (!user) { eduAuth.openModal('login'); return; }

  inp.value = '';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: curChatTitle, body: txt })
    });
    if (r.status === 401) { eduAuth.openModal('login'); return; }
    loadRoom();
  } catch (e2) { inp.value = txt; }
}

eduAuth.onChange((user) => {
  curUserId = user ? user.id : null;
  if (curChatTitle) loadRoom();
});

function markAllChatRead() {
  alert("Barcha suhbatlar o'qilgan deb belgilandi! ✓✓");
}
</script>
</body>
</html>
